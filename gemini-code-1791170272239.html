<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>紙袋から引く自己紹介</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #f7f3ed;
            color: #4a3e3d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            padding: 40px 25px;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.06);
            max-width: 480px;
            width: 100%;
            text-align: center;
            border: 2px solid #eae2d8;
        }
        .bag-icon {
            font-size: 3.5rem;
            margin-bottom: 10px;
            line-height: 1;
        }
        h1 {
            font-size: 1.3rem;
            color: #5c4b43;
            margin: 0 0 8px 0;
            font-weight: 700;
        }
        .sub-title {
            font-size: 0.85rem;
            color: #8c7b73;
            margin-bottom: 25px;
            line-height: 1.4;
        }
        .result-box {
            background: #fdfbf7;
            border: 2px dashed #d0c2b2;
            border-radius: 16px;
            padding: 25px 18px;
            margin-bottom: 30px;
            min-height: 170px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 14px;
            text-align: left;
        }
        .phrase-item {
            font-size: 1rem;
            color: #555;
            line-height: 1.5;
        }
        .label {
            font-weight: bold;
            color: #b5835a;
            display: inline-block;
            min-width: 70px;
        }
        .highlight {
            color: #2c2523;
            font-weight: bold;
            font-size: 1.15rem;
            background: linear-gradient(transparent 60%, #fbe8aa 60%);
            padding: 0 4px;
        }
        button {
            background-color: #b5835a;
            color: #ffffff;
            border: none;
            padding: 16px 36px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(181, 131, 90, 0.35);
            width: 100%;
            max-width: 280px;
        }
        button:hover {
            background-color: #9d6f48;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

<div class="card">
    <div class="bag-icon">🛍️</div>
    <h1>紙袋から引く自己紹介</h1>
    <p class="sub-title">友達に書いてもらったフレーズを紙袋から引いて<br>その場限りの自己紹介を作ります！</p>
    
    <div class="result-box" id="result">
        <p style="color: #998e86; text-align: center; margin: 0; font-size: 0.95rem;">
            「紙袋から引く！」ボタンを押して<br>言葉を組み合わせてみてください！
        </p>
    </div>

    <button onclick="generate()">紙袋から引く！</button>
</div>

<script>
    // 【一見】
    const partA = [
        "動物になめられそう",
        "肉きらいそうに見えて",
        "はじめて発したコトバは「カエルさん」",
        "オコジョ飼ってそう",
        "お腹弱そう、、、",
        "運動オンチそう"
    ];

    // 【実は】
    const partB = [
        "サボテンを育てたことがある",
        "どうでもいいことをよく覚えている",
        "コンビニアイス大体制覇！",
        "割とよく食べる",
        "ガチャガチャ永遠にみている",
        "売れるバンド青田買い打率5割",
        "あごの力が弱い",
        "三度の飯より活字好き",
        "お父さんが阿部寛に似ている",
        "機嫌はお寿司で取る"
    ];

    // 【○○です】
    const partC = [
        "シス単マスター",
        "長風呂",
        "ごはん屋さん探しの天才",
        "アボカド好き",
        "物は忘れるが恩は忘れない義理義理ガール",
        "「広告でよく見るクソゲー」マー"
    ];

    function getRandomItem(array) {
        return array[Math.floor(Math.random() * array.length)];
    }

    function generate() {
        const a = getRandomItem(partA);
        const b = getRandomItem(partB);
        const c = getRandomItem(partC);

        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = `
            <div class="phrase-item"><span class="label">一見：</span><span class="highlight">${a}</span></div>
            <div class="phrase-item"><span class="label">実は：</span><span class="highlight">${b}</span></div>
            <div class="phrase-item"><span class="label">結論：</span><span class="highlight">${c}</span> です！</div>
        `;
    }
</script>

</body>
</html>
